<!DOCTYPE html><html lang="ko"><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Python Bootcamp Slides</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); border-color: #c7d2fe; }
    .chip { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <header>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">코드잇 스프린트 AI Engineer Track 멘토링</h1>
      <p class="text-gray-600 mt-2">Codeit sprint AI Engineer track Mentoring</p>
    </header>

    <!-- 시작하기 (숨김)
    <section class="mt-6">
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Getting Started</h2>
      <div class="grid grid-cols-2 gap-3 mt-2">
        <a class="card block bg-white rounded-xl px-4 py-3 border" href="intro/intro.html">
          <h3 class="font-bold">Mentor Introduction</h3>
          <p class="text-gray-600 text-sm">멘토 소개</p>
        </a>
        <a class="card block bg-white rounded-xl px-4 py-3 border" href="OT/page_1.html">
          <h3 class="font-bold">OT</h3>
          <p class="text-gray-600 text-sm">슬라이드 1~4</p>
        </a>
      </div>
    </section> -->

    <!-- 주차별 -->
    <section class="mt-6">
      <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Weekly Sessions</h2>
      <ul id="weeks" class="mt-2 grid grid-cols-1 md:grid-cols-2 gap-3"></ul>
    </section>
  </div>

  <script>
    // 주차 추가는 여기에만 하면 됩니다.
    const weeks = [
      { week: "1",  topic: "python 기초", links: [
        { label: "Slides", href: "week-1/slides/page_1.html" },
        { label: "Quiz",   href: "week-1/quiz/quiz.html" },
      ]},
      { week: "2",  topic: "math, regression", links: [
        { label: "Slides", href: "week-2/slides/page_1.html" },
        { label: "Mission Review", href: "week-2/mission_review/page_1.html" },
        { label: "Quiz",   href: "week-2/quiz/quiz.html" },
      ]},
      { week: "3",  topic: "tree-ensemble", links: [
        { label: "Slides", href: "week-3/slides/page_1.html" },
        { label: "Quiz",   href: "week-3/quiz/quiz.html" },
      ]},
      { week: "4",  topic: "MLP ~ CNN/RNN", links: [
        { label: "Slides", href: "week-4/slides/page_1.html" },
      ]},
      { week: "5",  topic: "AE, VAE", links: [
        { label: "Slides", href: "week-5/slides/page_1.html" },
      ]},
      { week: "6",  topic: "Domain Augmentation", links: [
        { label: "Slides", href: "week-6/page_1.html" },
        { label: "Augmentation → Domain Adaptation", href: "week-6-2/augmentation_to_domain_adaptation.html" },
      ]},
      { week: "7",  topic: "객체인식, 이미지 세그멘테이션", links: [
        { label: "Slides", href: "week-7/slide.html" },
        { label: "Object Detection", href: "week-7/01_object_detection.html" },
        { label: "Image Segmentation", href: "week-7/02_image_segmentation.html" },
      ]},
      { week: "8",  topic: "MLOps", links: [
        { label: "Slides", href: "week-8/slides.html" },
      ]},
      { week: "9",  topic: "Computer Vision", links: [
        { label: "Slides", href: "week-9/computer_vision.html" },
      ]},
      { week: "11", topic: "Text Data & Embeddings", links: [
        { label: "Slides", href: "week-11/slides.html" },
      ]},
      { week: "12", topic: "BERT/GPT", links: [
        { label: "Slides", href: "week-12/slides.html" },
      ]},
      { week: "13", topic: "프롬프트, 하네스", links: [
        { label: "Slides", href: "week-13/slides4.html" },
      ]},
      { week: "14", topic: "LLM 파인 튜닝", links: [
        { label: "Slides", href: "week-14/pages.html" },
      ]},
      { week: "15", topic: "RAG", links: [
        { label: "Slides", href: "week-15/slides.html" },
      ]},
      { week: "16", topic: "Paper Flowchart", links: [
        { label: "Slides", href: "week-16/slides.html" },
      ]},
      { week: "17", topic: "Overfitting", links: [
        { label: "Slides", href: "week-17/slides.html" },
      ]},
    ];

    const list = document.getElementById("weeks");
    for (const w of weeks) {
      const li = document.createElement("li");
      li.className = "card bg-white rounded-xl border p-3 flex items-center gap-3";

      const badge = document.createElement("a");
      badge.href = w.links[0].href;
      badge.className = "shrink-0 w-11 h-11 rounded-lg bg-indigo-50 text-indigo-700 flex flex-col items-center justify-center leading-none";
      badge.innerHTML = `<span class="text-[9px] font-semibold uppercase tracking-wider">Week</span><span class="text-lg font-extrabold">${w.week}</span>`;

      const body = document.createElement("div");
      body.className = "min-w-0 flex-1";
      const title = document.createElement("a");
      title.href = w.links[0].href;
      title.className = "block font-bold truncate";
      title.textContent = w.topic;

      const chips = document.createElement("div");
      chips.className = "flex flex-wrap gap-1.5 mt-1";
      for (const l of w.links) {
        const a = document.createElement("a");
        a.href = l.href;
        a.textContent = l.label;
        a.className = "chip text-xs px-2 py-0.5 rounded-full border border-gray-200 text-gray-600 hover:bg-indigo-600 hover:text-white hover:border-indigo-600";
        chips.appendChild(a);
      }

      body.append(title, chips);
      li.append(badge, body);
      list.appendChild(li);
    }
  </script>
</body></html>
